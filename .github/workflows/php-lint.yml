name: PHP syntax validation

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
